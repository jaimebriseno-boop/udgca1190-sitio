# Herramientas estadístico-epidemiológicas, predictivas y docentes del CA.
# tipo:   predictiva | estadistica | pipeline | docente | consulta
# estado: activa | beta | desarrollo
# linea:  id de una LGAC (data/lineas.yml)
# seccion: (opcional) laboratorio → se agrupa en la sección «Laboratorio» de la
#          página de Herramientas; bioestadistica → sección «Bioestadística
#          abierta»; `orden` (1, 2, 3…) fija su posición dentro de su sección.

- id: propedeutica-basada-en-evidencia
  nombre: "Propedéutica médica basada en evidencia"
  tipo: estadistica
  estado: activa
  resumen: "Buscador de signos de exploración física con su rendimiento diagnóstico medido."
  descripcion: |
    Herramienta docente de exploración física con sensibilidad, especificidad,
    razones de verosimilitud, valores predictivos y artículos de referencia
    cuando se recuperaron. Incluye búsqueda por signo, epónimo, condición o
    maniobra, calculadora de probabilidad posprueba y guía de lectura crítica.
    Distingue valores observados de cálculos y conserva vacíos los datos no
    recuperados. Bilingüe (es/en).
  tecnologias: ["Python", "JavaScript", "PubMed", "Crossref"]
  linea: clinica-epidemiologica-traslacional
  enlace_app: "/herramientas/propedeutica"
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: true

- id: dengue-forecast
  nombre: "Dengue Forecast"
  tipo: predictiva
  estado: beta
  resumen: "Pronóstico probabilístico y alerta temprana de dengue para los 32 estados de México."
  descripcion: |
    Ensamble de pronóstico que combina modelos estadísticos (regresión con rezagos
    climáticos), aprendizaje automático (gradient boosting) y modelos espaciales
    bayesianos sobre un panel mensual de 15,591 observaciones por estado (1985–2026),
    con recalibración en línea por predicción conforme y un clasificador de alarma de
    brote (AUC 0.846 a un mes). Genera pronósticos a 1, 3, 6 y 12 meses para alerta y
    respuesta temprana (EWARS). Preprint en evaluación por pares (Briseño-Ramírez
    et al., Research Square 2026).
  tecnologias: ["R", "Gradient boosting", "Bayesian", "Conformal prediction"]
  linea: epidemiologia-infecciosas
  enlace_app: "/herramientas/dengue-forecast"
  repositorio: ""
  doi: "10.21203/rs.3.rs-10035640/v1"
  captura: "/herramientas/placeholder.svg"
  destacado: true

- id: virologia
  nombre: "VIROLOGÍA"
  tipo: docente
  estado: activa
  resumen: "Herramienta con estrategias de aprendizaje activo en Virología."
  descripcion: |
    Herramienta didáctica de virología médica para la unidad de aprendizaje
    Microbiología II. El recorrido parte de dos árboles taxonómicos interactivos
    (virus DNA y virus RNA) y desciende hasta 28 fichas de familia, cada una con
    historia, taxonomía, microbiología, fisiopatología, cuadro clínico,
    diagnóstico y tratamiento, con figuras propias, tablas comparativas,
    nemotecnias y trampas de examen. Incluye buscador por familia, género,
    virus o síndrome, y una sección de herramientas diagnósticas del
    laboratorio de virología (diez técnicas, de la PCR y la carga viral al
    cultivo, con sus ventanas de utilidad y desempeño). Contenido referenciado
    a Mandell PPID 10.ª edición y a las guías citadas al pie de cada ficha.
  tecnologias: ["HTML", "SVG", "JavaScript"]
  linea: epidemiologia-infecciosas
  enlace_app: "/herramientas/virologia"
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: true

- id: wisca-bayesiano
  nombre: "WISCA bayesiano"
  tipo: estadistica
  estado: activa
  resumen: "Antibiograma de incidencia ponderada por síndrome (modelo bayesiano)."
  descripcion: |
    Estimación de cobertura empírica mediante antibiogramas acumulados ponderados
    (Weighted-Incidence Syndromic Combination Antibiogram) con agrupamiento parcial
    bayesiano. Aplicado a endocarditis, candidosis invasiva, ITU comunitaria,
    neumonía asociada a ventilador y artritis séptica; estima cobertura por síndrome
    y estratos comunitario/asociado a la atención.
  tecnologias: ["R", "brms", "Stan"]
  linea: epidemiologia-infecciosas
  enlace_app: ""
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: true

- id: genomica-wgs
  nombre: "Pipeline de genómica microbiana (WGS)"
  tipo: pipeline
  estado: activa
  resumen: "Ensamblado, tipificación y resistencia genotípica desde secuenciación."
  descripcion: |
