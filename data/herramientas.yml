# ── Sección «Laboratorio» · serie «Del tubo al diagnóstico» ─────────────────
# Mini-sitio en public/herramientas/laboratorio/app/ (índice + tres herramientas
# enlazadas entre sí), generado con scripts/laboratorio_retematizar.py.
# Autoría: De Arcos-Jiménez JC, Briseño-Ramírez J · Versión 2.0 · septiembre 2026.

- id: lab-biomarcadores
  orden: 1
  nombre: "Del tubo al diagnóstico: consulta de 60 biomarcadores"
  tipo: consulta
  estado: activa
  seccion: laboratorio
  resumen: "Qué es cada marcador, en qué tubo se toma, cómo se conserva y se mide, por qué sube o baja y cómo se interpreta."
  descripcion: |
    Consulta de sesenta biomarcadores explicados de principio a fin, siguiendo el
    ciclo de la muestra: preanalítica (muestra, tubo, ayuno, toma, procesamiento,
    estabilidad y criterios de rechazo), analítica (método, unidades, conversión,
    estandarización y control de calidad), interpretación (por qué sube o baja,
    modificadores e interferencias) y postanalítica (valores críticos, variación
    biológica, delta check, reporte y seguimiento). Buscador por nombre o sigla.
    Basada en Tietz, Henry's, CLSI GP41/GP44/EP07, la base EFLM de variación
    biológica, guías clínicas e insertos vigentes. Sin intervalos de referencia:
    los pone cada laboratorio. Funciona sin internet.
  tecnologias: ["HTML", "JavaScript", "CLSI", "EFLM"]
  linea: clinica-epidemiologica-traslacional
  enlace_app: "/herramientas/laboratorio/biomarcadores"
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: true

- id: lab-intervalos-referencia
  orden: 2
  nombre: "Intervalos de referencia: verificar, establecer y transferir"
  tipo: estadistica
  estado: activa
  seccion: laboratorio
  resumen: "¿El intervalo del inserto sirve para mi población y mi método? ¿Cómo construyo el mío?"
  descripcion: |
    Guía práctica con tres calculadoras: verificar un intervalo publicado con 20
    individuos de referencia (CLSI EP28), establecer un intervalo propio con 120 o
    más resultados por grupo (método directo, percentiles no paramétricos con
    detección de valores aberrantes) y estimarlo con los resultados que el
    laboratorio ya tiene (método indirecto: Hoffmann, refineR/reflimR). Incluye
    ruta de decisión (adoptar, verificar o establecer), transferencia entre
    métodos, partición por sexo y edad (Harris y Boyd), cuestionario de selección
    y registro de documentación. Los datos se procesan en el navegador.
  tecnologias: ["JavaScript", "CLSI EP28", "Harris–Boyd", "refineR"]
  linea: ciencia-datos-poblacionales
  enlace_app: "/herramientas/laboratorio/intervalos-de-referencia"
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: true

- id: lab-delta-check
  orden: 3
  nombre: "Delta check: comparar al paciente consigo mismo"
  tipo: estadistica
  estado: activa
  seccion: laboratorio
  resumen: "¿Este cambio entre dos resultados del mismo paciente es real, es error o es ruido? Qué límite y qué ventana usar."
  descripcion: |
    Qué es el delta check y por qué importa; tipos y fórmulas (absoluto,
    porcentual, por tiempo y por variación biológica con el valor de cambio de
    referencia, RCV); calculadora con semáforo y gráfica; herramienta para fijar
    el umbral y la ventana con los pares históricos del propio laboratorio según
    CLSI EP33; orientación por analito; secuencia de respuesta ante la alerta y
    guía de implementación. Basada en CLSI EP33 (2023), EFLM, Randell y Yenice
    2019, KDIGO y ESC. Los datos se procesan en el navegador.
  tecnologias: ["JavaScript", "CLSI EP33", "EFLM", "RCV"]
  linea: clinica-epidemiologica-traslacional
  enlace_app: "/herramientas/laboratorio/delta-check"
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: true

# ── Sección «Bioestadística abierta» · calculadoras explicadas ───────────────
# Páginas nativas de Astro: src/pages/herramientas/bioestadistica/[slug].astro a
# partir de data/bioestadistica/calculadoras/<slug>.yml. Una tarjeta por grupo
# (no una por calculadora); el ancla apunta al grupo en el índice de la sección.
# Autoría: Briseño-Ramírez J, De Arcos-Jiménez JC · Versión 1.0 · septiembre 2026.

- id: bio-diagnostico
  orden: 1
  nombre: "Bioestadística abierta: pruebas diagnósticas"
  tipo: estadistica
  estado: beta
  seccion: bioestadistica
  resumen: "Sensibilidad, especificidad, valores predictivos y razones de verosimilitud desde una tabla 2×2; probabilidad posprueba con nomograma de Fagan."
  descripcion: |
    Calculadoras explicadas de rendimiento diagnóstico: tabla 2×2 con IC de
    Wilson y de Simel para las razones de verosimilitud, probabilidad posprueba
    por el teorema de Bayes con nomograma de Fagan y valores predictivos a
    partir de sensibilidad, especificidad y prevalencia. Cada una muestra la
    ecuación clásica, una explicación sencilla, la interpretación en lenguaje
    llano, el código R equivalente y las fuentes originales. Los datos se
    procesan en el navegador. Bilingüe (es/en).
  tecnologias: ["TypeScript", "R", "webR"]
  linea: clinica-epidemiologica-traslacional
  enlace_app: "/herramientas/bioestadistica#diagnostico"
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: true

- id: bio-asociacion
  orden: 2
  nombre: "Bioestadística abierta: asociación y efecto en tablas 2×2"
  tipo: estadistica
  estado: beta
  seccion: bioestadistica
  resumen: "Riesgo relativo, razón de momios, reducción absoluta del riesgo y NNT; χ², Fisher exacto y McNemar."
  descripcion: |
    Medidas de asociación y efecto con IC (RR de Katz, OR de Woolf, RRA de
    Newcombe, NNT de Altman), pruebas de independencia (χ² de Pearson, Yates,
    Fisher exacto, φ) y McNemar para proporciones pareadas. Con ecuaciones,
    explicación, interpretación, código R y referencias originales. Bilingüe.
  tecnologias: ["TypeScript", "R", "webR"]
  linea: clinica-epidemiologica-traslacional
  enlace_app: "/herramientas/bioestadistica#asociacion"
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: true

- id: bio-muestra
  orden: 3
  nombre: "Bioestadística abierta: tamaño de muestra y poder"
  tipo: estadistica
  estado: beta
  seccion: bioestadistica
  resumen: "Estimar una proporción o una media, comparar dos proporciones o dos medias, precisión diagnóstica (Buderer) y correlación, con curvas de poder."
  descripcion: |
    Siete calculadoras de tamaño de muestra y poder con las fórmulas clásicas
    (Cochran, Fleiss, t no central idéntica a power.t.test, Buderer, z de
    Fisher), modo inverso (poder dado n), ajuste por pérdidas y curva de poder.
    Con ecuaciones, explicación, interpretación, código R y referencias. Bilingüe.
  tecnologias: ["TypeScript", "R", "webR"]
  linea: clinica-epidemiologica-traslacional
  enlace_app: "/herramientas/bioestadistica#muestra"
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: false

- id: bio-acuerdo
  orden: 4
  nombre: "Bioestadística abierta: concordancia y descriptivos"
  tipo: estadistica
  estado: beta
  seccion: bioestadistica
  resumen: "Kappa de Cohen, IC de una proporción (seis métodos) y de una media, media y DE a partir de la mediana, descriptivos con gráfica."
  descripcion: |
    Kappa simple y ponderada con el error estándar de Fleiss, Cohen y Everitt;
    intervalo de confianza de una proporción con Wilson, Clopper-Pearson,
    Agresti-Coull, Jeffreys y Wald comparados; IC de una media; media y DE a
    partir de mediana, rango o IQR (Luo, Wan, Hozo); descriptivos de una
    columna pegada con histograma y caja. Con ecuaciones, explicación,
    interpretación, código R y referencias. Bilingüe.
  tecnologias: ["TypeScript", "R", "webR"]
  linea: clinica-epidemiologica-traslacional
  enlace_app: "/herramientas/bioestadistica#acuerdo"
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: false

- id: bio-modelos
  orden: 5
  nombre: "Bioestadística abierta: modelos de regresión y supervivencia"
  tipo: estadistica
  estado: beta
  seccion: bioestadistica
  resumen: "Kaplan-Meier con IC de Greenwood, mediana y log-rank, ya disponible; regresión logística, Cox y lineal con R en el navegador (webR), en preparación."
  descripcion: |
    Supervivencia y modelos multivariables sencillos. Disponible: curvas de
    Kaplan-Meier a partir de columnas pegadas (tiempo, evento y hasta dos
    grupos) con IC log-log de Greenwood, mediana de supervivencia, tabla en
    riesgo y prueba de log-rank, calculadas en TypeScript y validadas contra
    survival de R. En preparación, con R dentro del navegador (webR):
    regresión logística binaria con OR e IC, Hosmer-Lemeshow y AUC; riesgos
    proporcionales de Cox con prueba de proporcionalidad; regresión lineal
    múltiple. Los datos pegados nunca salen del navegador. Bilingüe.
  tecnologias: ["TypeScript", "R", "webR"]
  linea: clinica-epidemiologica-traslacional
  enlace_app: "/herramientas/bioestadistica#modelos"
  repositorio: ""
  doi: ""
  captura: "/herramientas/placeholder.svg"
  destacado: false
