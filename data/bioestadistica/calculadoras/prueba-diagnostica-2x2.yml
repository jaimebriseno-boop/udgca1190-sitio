grafica: ic-forest
es:
  titulo: "Prueba diagnóstica (tabla 2×2): sensibilidad, especificidad, valores predictivos, razones de verosimilitud y DOR"
  titulo_corto: "Prueba diagnóstica (tabla 2×2)"
  meta: "Calcula sensibilidad, especificidad, valores predictivos, exactitud, índice de Youden, razones de verosimilitud (LR+ y LR−) y razón de momios diagnóstica con intervalos de confianza a partir de una tabla 2×2, con interpretación, código R y referencias. Los datos no salen del navegador."
  intro: "Captura los cuatro conteos de la tabla 2×2 (prueba frente al estándar de referencia) y obtén Sn, Sp, VPP, VPN, prevalencia, exactitud, índice de Youden, LR+, LR− y DOR con sus intervalos de confianza, la interpretación en lenguaje llano y el código de R equivalente."
  explicacion:
    - "Una prueba diagnóstica se evalúa comparándola con un estándar de referencia en la misma población. La tabla 2×2 cruza el resultado de la prueba (positivo o negativo) con el estado real (enfermo o sano): verdaderos positivos (VP), falsos positivos (FP), falsos negativos (FN) y verdaderos negativos (VN)."
    - "La sensibilidad es la proporción de enfermos con prueba positiva y la especificidad, la de sanos con prueba negativa (Yerushalmy 1947). Ambas describen la prueba y no dependen de la prevalencia. Los valores predictivos responden a la pregunta clínica (¿qué probabilidad hay de estar enfermo con un resultado positivo?), pero cambian con la prevalencia (Vecchio 1966): los que se muestran aquí valen para la prevalencia de esta muestra."
    - "Las razones de verosimilitud (LR+ y LR−) resumen ambas propiedades en un solo número por resultado y son las que se trasladan a la probabilidad posprueba con el teorema de Bayes (nomograma de Fagan). La razón de momios diagnóstica (DOR) condensa la capacidad discriminativa global en una sola cifra, útil para comparar pruebas, no para decidir sobre un paciente."
    - "Cada proporción lleva el intervalo de confianza del método elegido (Wilson por defecto, el recomendado por Newcombe 1998); las razones llevan el intervalo logarítmico de Simel (1991) y de Woolf (1955). Cuando una celda vale 0, una razón queda en 0 o en infinito y sin intervalo; la corrección de Haldane-Anscombe (sumar 0.5 a cada celda) devuelve una estimación finita y debe reportarse."
  ecuaciones:
    - id: proporciones
      tex: '\mathrm{Sn}=\frac{a}{a+c},\qquad \mathrm{Sp}=\frac{d}{b+d},\qquad \mathrm{VPP}=\frac{a}{a+b},\qquad \mathrm{VPN}=\frac{d}{c+d},\qquad \mathrm{Exactitud}=\frac{a+d}{n}'
      simbolos:
        - { s: 'a', def: "verdaderos positivos (VP)" }
        - { s: 'b', def: "falsos positivos (FP)" }
        - { s: 'c', def: "falsos negativos (FN)" }
        - { s: 'd', def: "verdaderos negativos (VN)" }
        - { s: 'n', def: "total, a + b + c + d" }
      nota: "Sensibilidad y especificidad (Yerushalmy 1947); valores predictivos con la prevalencia de la muestra, (a + c)/n."
    - id: razones
      tex: '\mathrm{LR}^{+}=\frac{\mathrm{Sn}}{1-\mathrm{Sp}},\qquad \mathrm{LR}^{-}=\frac{1-\mathrm{Sn}}{\mathrm{Sp}},\qquad \mathrm{DOR}=\frac{ad}{bc}=\frac{\mathrm{LR}^{+}}{\mathrm{LR}^{-}}'
      simbolos: []
      nota: "Razones de verosimilitud y razón de momios diagnóstica (Glas 2003)."
    - id: ic_lr
      tex: '\mathrm{IC}(\mathrm{LR}^{+})=\exp\!\left[\ln \mathrm{LR}^{+}\pm z_{1-\alpha/2}\sqrt{\frac{1}{a}-\frac{1}{a+c}+\frac{1}{b}-\frac{1}{b+d}}\right],\qquad \mathrm{IC}(\mathrm{LR}^{-})=\exp\!\left[\ln \mathrm{LR}^{-}\pm z\sqrt{\frac{1}{c}-\frac{1}{a+c}+\frac{1}{d}-\frac{1}{b+d}}\right]'
      simbolos:
        - { s: 'z_{1-\alpha/2}', def: "cuantil normal del nivel de confianza (1.96 al 95 %)" }
      nota: "Intervalos logarítmicos de Simel, Samsa y Matchar (1991). Con la corrección de Haldane-Anscombe, a, b, c y d llevan 0.5 sumado."
    - id: ic_dor
      tex: '\mathrm{IC}(\mathrm{DOR})=\exp\!\left[\ln \mathrm{DOR}\pm z\sqrt{\frac{1}{a}+\frac{1}{b}+\frac{1}{c}+\frac{1}{d}}\right]'
      simbolos: []
      nota: "Intervalo logarítmico de Woolf (1955)."
    - id: youden
      tex: 'J=\mathrm{Sn}+\mathrm{Sp}-1,\qquad \mathrm{IC}(J)=J\pm z\sqrt{\frac{\mathrm{Sn}\,(1-\mathrm{Sn})}{a+c}+\frac{\mathrm{Sp}\,(1-\mathrm{Sp})}{b+d}}'
      simbolos: []
      nota: "Índice de Youden (1950) con intervalo de Wald por el método delta."
    - id: wilson
      tex: '\frac{\hat p+\frac{z^2}{2m}\pm z\sqrt{\frac{\hat p\,(1-\hat p)}{m}+\frac{z^2}{4m^2}}}{1+\frac{z^2}{m}}'
      simbolos:
        - { s: '\hat p', def: "proporción observada, x/m" }
        - { s: 'm', def: "denominador de la proporción (a + c, b + d, a + b, c + d o n)" }
      nota: "Intervalo de Wilson (1927), el método por defecto para cada proporción; el selector ofrece Clopper-Pearson, Agresti-Coull, Jeffreys y Wald (ver la calculadora «IC de una proporción»)."
  etiquetas:
    vp: "Verdaderos positivos (VP)"
    fp: "Falsos positivos (FP)"
    fn: "Falsos negativos (FN)"
    vn: "Verdaderos negativos (VN)"
    nivel: "Nivel de confianza"
    metodo: "Método del IC de las proporciones"
    "metodo.wilson": "Wilson (score)"
    "metodo.clopper-pearson": "Clopper-Pearson (exacto)"
    "metodo.agresti-coull": "Agresti-Coull"
    "metodo.jeffreys": "Jeffreys"
    "metodo.wald": "Wald (asintótico)"
    corr: "Corrección de Haldane-Anscombe (razones)"
    "corr.0": "Sin corrección"
    "corr.0.5": "Sumar 0.5 a cada celda"
    "tabla.filas": "Resultado de la prueba"
    "tabla.columnas": "Estándar de referencia"
    "tabla.fila1": "Positivo"
    "tabla.fila2": "Negativo"
    "tabla.col1": "Enfermo"
    "tabla.col2": "Sano"
    "tabla.total": "Total"
    n: "Total de participantes (n)"
    sn: "Sensibilidad (Sn)"
    sp: "Especificidad (Sp)"
    vpp: "Valor predictivo positivo (VPP)"
    vpn: "Valor predictivo negativo (VPN)"
    prev: "Prevalencia en la muestra"
    exactitud: "Exactitud"
    youden: "Índice de Youden (J)"
    lr_pos: "LR+"
    lr_neg: "LR−"
    dor: "Razón de momios diagnóstica (DOR)"
    nota_lr: "método logarítmico de Simel"
    nota_dor: "método logarítmico de Woolf"
    nota_youden: "método delta"
    grafica_razones: "Razones (escala logarítmica; referencia en 1)"
  ayudas:
    metodo: "Wilson es el método recomendado (Newcombe 1998). Wald solo con fines didácticos."
    corr: "Úsala cuando una celda vale 0: suma 0.5 a las cuatro celdas antes de calcular LR+, LR− y DOR (no afecta a Sn, Sp ni a los valores predictivos)."
  interpretacion:
    resumen: "De {n} participantes, {vp} + {fn} tenían la enfermedad y {fp} + {vn} no la tenían (prevalencia en la muestra: {prev}). La prueba detecta al {sn} de las personas con la enfermedad (sensibilidad; IC {nivel}: {sn_ic}) y descarta correctamente al {sp} de las que no la tienen (especificidad; IC {nivel}: {sp_ic}). Exactitud global: {exactitud} (IC {nivel}: {exactitud_ic})."
    "lr_pos.grande": "LR+ = {lr_pos} ({lr_pos_ic}): un resultado positivo multiplica los momios preprueba por {lr_pos}, un cambio grande y a menudo concluyente de la probabilidad de enfermedad (Jaeschke 1994)."
    "lr_pos.moderado": "LR+ = {lr_pos} ({lr_pos_ic}): un resultado positivo multiplica los momios preprueba por {lr_pos}, un cambio moderado de la probabilidad de enfermedad (Jaeschke 1994)."
    "lr_pos.pequeno": "LR+ = {lr_pos} ({lr_pos_ic}): un resultado positivo multiplica los momios preprueba por {lr_pos}, un cambio pequeño de la probabilidad, aunque a veces importante (Jaeschke 1994)."
    "lr_pos.minimo": "LR+ = {lr_pos} ({lr_pos_ic}): un resultado positivo apenas modifica la probabilidad de enfermedad (cambio rara vez importante, Jaeschke 1994)."
    "lr_pos.nulo": "LR+ = {lr_pos} ({lr_pos_ic}): un resultado positivo no aumenta la probabilidad de enfermedad; con este valor la prueba no discrimina (o la tabla está invertida)."
    "lr_neg.grande": "LR− = {lr_neg} ({lr_neg_ic}): un resultado negativo divide los momios preprueba entre {lr_neg}, es decir, reduce mucho la probabilidad de enfermedad; suele bastar para descartarla en probabilidades preprueba moderadas (Jaeschke 1994)."
    "lr_neg.moderado": "LR− = {lr_neg} ({lr_neg_ic}): un resultado negativo reduce de forma moderada la probabilidad de enfermedad (Jaeschke 1994)."
    "lr_neg.pequeno": "LR− = {lr_neg} ({lr_neg_ic}): un resultado negativo reduce poco la probabilidad de enfermedad, aunque a veces de forma relevante (Jaeschke 1994)."
    "lr_neg.minimo": "LR− = {lr_neg} ({lr_neg_ic}): un resultado negativo apenas reduce la probabilidad de enfermedad; no sirve para descartarla (Jaeschke 1994)."
    "lr_neg.nulo": "LR− = {lr_neg} ({lr_neg_ic}): un resultado negativo no reduce la probabilidad de enfermedad; con este valor la prueba no discrimina (o la tabla está invertida)."
    predictivos: "En esta muestra, {vpp} de los positivos tenían la enfermedad (VPP; IC {nivel}: {vpp_ic}) y {vpn} de los negativos no la tenían (VPN; IC {nivel}: {vpn_ic}). Ambas cifras dependen de la prevalencia ({prev}) y no se trasladan a otra población; en un diseño de casos y controles no son válidas. Para otra prevalencia usa la calculadora «Valores predictivos»."
    dor: "DOR = {dor} ({dor_ic}): los momios de un resultado positivo son {dor} veces mayores en las personas con la enfermedad que en las que no la tienen. Índice de Youden J = {youden} (IC {nivel}: {youden_ic}); J = 1 sería una prueba perfecta y J = 0, una prueba sin valor."
    "dor.indefinido": "DOR = {dor}: con una celda en 0 la razón de momios diagnóstica no está definida (0 o infinito) y no tiene intervalo; aplica la corrección de Haldane-Anscombe para obtener una estimación finita. Índice de Youden J = {youden} (IC {nivel}: {youden_ic})."
    metodos_haldane: "Las razones de verosimilitud y la razón de momios diagnóstica se calcularon tras sumar 0.5 a cada celda de la tabla (corrección de Haldane-Anscombe) [{ref:haldane1956},{ref:anscombe1956}]."
  avisos:
    celda_cero: "Hay una celda con 0: LR+, LR− o DOR quedan en 0 o en infinito y sin intervalo. Puedes aplicar la corrección de Haldane-Anscombe (sumar 0.5 a cada celda) en el selector; repórtala si la usas."
    haldane_aplicado: "Corrección de Haldane-Anscombe aplicada: LR+, LR− y DOR se calcularon con 0.5 sumado a cada celda. Sn, Sp, valores predictivos y J no cambian. Repórtala en Métodos."
    n_pequeno: "Grupos pequeños ({enfermos} con la enfermedad, {sanos} sin ella): con menos de 10 por grupo los intervalos son muy amplios y las estimaciones, inestables."
    prev_extrema: "La prevalencia en la muestra es menor del 5 % o mayor del 95 %: los valores predictivos son poco informativos y el grupo minoritario aporta pocos datos."
    wald_no_recomendado: "Alguna celda tiene menos de 5 observaciones: el intervalo de Wald puede salirse de [0, 1] y no debe reportarse; prefiere Wilson o Jeffreys."
    tabla_invertida: "LR+ menor que 1 o LR− mayor que 1: un resultado positivo reduce la probabilidad de enfermedad. Comprueba la orientación de la tabla (filas = prueba, columnas = estándar de referencia)."
  metodos: "Se calcularon la sensibilidad, la especificidad, los valores predictivos, la exactitud, el índice de Youden, las razones de verosimilitud (LR+ y LR−) y la razón de momios diagnóstica (DOR) a partir de la tabla 2×2 frente al estándar de referencia [{ref:yerushalmy1947},{ref:youden1950}]. Los intervalos de confianza al {nivel} de las proporciones se obtuvieron con el método de {metodo_nombre} {metodo_refs}; los de las razones de verosimilitud, con el método logarítmico de Simel et al. [{ref:simel1991}]; el de la DOR, con el método de Woolf [{ref:woolf1955},{ref:glas2003}], y el del índice de Youden, por el método delta.{nota_corr} Los cálculos se realizaron con la calculadora «{titulo_corto}» de Bioestadística abierta (Cuerpo Académico UDG-CA-1190, {url}), verificada contra R (paquete binom)."
  ejemplo_descripcion: "Ejemplo ilustrativo: prueba rápida de antígeno NS1 frente a RT-PCR para dengue en 200 pacientes febriles: 68 verdaderos positivos, 6 falsos positivos, 12 falsos negativos y 114 verdaderos negativos (datos ficticios)."
  grafica_titulo: "Estimaciones con su intervalo de confianza: proporciones (arriba) y razones en escala logarítmica (abajo)"
en:
  titulo: "Diagnostic test (2×2 table): sensitivity, specificity, predictive values, likelihood ratios and DOR"
  titulo_corto: "Diagnostic test (2×2 table)"
  meta: "Compute sensitivity, specificity, predictive values, accuracy, Youden's index, likelihood ratios (LR+ and LR−) and the diagnostic odds ratio with confidence intervals from a 2×2 table, with interpretation, R code and references. Data never leave the browser."
  intro: "Enter the four counts of the 2×2 table (test versus reference standard) and get Sn, Sp, PPV, NPV, prevalence, accuracy, Youden's index, LR+, LR− and DOR with their confidence intervals, a plain-language interpretation and the equivalent R code."
  explicacion:
    - "A diagnostic test is evaluated against a reference standard in the same population. The 2×2 table crosses the test result (positive or negative) with the true state (diseased or not): true positives (TP), false positives (FP), false negatives (FN) and true negatives (TN)."
    - "Sensitivity is the proportion of diseased people with a positive test and specificity the proportion of non-diseased people with a negative test (Yerushalmy 1947). Both describe the test and do not depend on prevalence. Predictive values answer the clinical question (how likely is disease given a positive result?) but change with prevalence (Vecchio 1966): the ones shown here hold for this sample's prevalence."
    - "Likelihood ratios (LR+ and LR−) summarise both properties in a single number per result and are what carries over to the post-test probability through Bayes' theorem (Fagan's nomogram). The diagnostic odds ratio (DOR) condenses overall discrimination into one figure, useful for comparing tests, not for deciding about a patient."
    - "Each proportion carries the confidence interval of the chosen method (Wilson by default, as recommended by Newcombe 1998); the ratios carry the logarithmic intervals of Simel (1991) and Woolf (1955). When a cell is 0 a ratio becomes 0 or infinite and has no interval; the Haldane-Anscombe correction (adding 0.5 to each cell) yields a finite estimate and must be reported."
  ecuaciones:
    - id: proporciones
      tex: '\mathrm{Sn}=\frac{a}{a+c},\qquad \mathrm{Sp}=\frac{d}{b+d},\qquad \mathrm{PPV}=\frac{a}{a+b},\qquad \mathrm{NPV}=\frac{d}{c+d},\qquad \mathrm{Accuracy}=\frac{a+d}{n}'
      simbolos:
        - { s: 'a', def: "true positives (TP)" }
        - { s: 'b', def: "false positives (FP)" }
        - { s: 'c', def: "false negatives (FN)" }
        - { s: 'd', def: "true negatives (TN)" }
        - { s: 'n', def: "total, a + b + c + d" }
      nota: "Sensitivity and specificity (Yerushalmy 1947); predictive values at the sample prevalence, (a + c)/n."
    - id: razones
      tex: '\mathrm{LR}^{+}=\frac{\mathrm{Sn}}{1-\mathrm{Sp}},\qquad \mathrm{LR}^{-}=\frac{1-\mathrm{Sn}}{\mathrm{Sp}},\qquad \mathrm{DOR}=\frac{ad}{bc}=\frac{\mathrm{LR}^{+}}{\mathrm{LR}^{-}}'
      simbolos: []
      nota: "Likelihood ratios and diagnostic odds ratio (Glas 2003)."
    - id: ic_lr
      tex: '\mathrm{CI}(\mathrm{LR}^{+})=\exp\!\left[\ln \mathrm{LR}^{+}\pm z_{1-\alpha/2}\sqrt{\frac{1}{a}-\frac{1}{a+c}+\frac{1}{b}-\frac{1}{b+d}}\right],\qquad \mathrm{CI}(\mathrm{LR}^{-})=\exp\!\left[\ln \mathrm{LR}^{-}\pm z\sqrt{\frac{1}{c}-\frac{1}{a+c}+\frac{1}{d}-\frac{1}{b+d}}\right]'
      simbolos:
        - { s: 'z_{1-\alpha/2}', def: "normal quantile for the confidence level (1.96 at 95%)" }
      nota: "Logarithmic intervals of Simel, Samsa and Matchar (1991). With the Haldane-Anscombe correction, a, b, c and d carry 0.5 added."
    - id: ic_dor
      tex: '\mathrm{CI}(\mathrm{DOR})=\exp\!\left[\ln \mathrm{DOR}\pm z\sqrt{\frac{1}{a}+\frac{1}{b}+\frac{1}{c}+\frac{1}{d}}\right]'
      simbolos: []
      nota: "Woolf's (1955) logarithmic interval."
    - id: youden
      tex: 'J=\mathrm{Sn}+\mathrm{Sp}-1,\qquad \mathrm{CI}(J)=J\pm z\sqrt{\frac{\mathrm{Sn}\,(1-\mathrm{Sn})}{a+c}+\frac{\mathrm{Sp}\,(1-\mathrm{Sp})}{b+d}}'
      simbolos: []
      nota: "Youden's index (1950) with a delta-method Wald interval."
    - id: wilson
      tex: '\frac{\hat p+\frac{z^2}{2m}\pm z\sqrt{\frac{\hat p\,(1-\hat p)}{m}+\frac{z^2}{4m^2}}}{1+\frac{z^2}{m}}'
      simbolos:
        - { s: '\hat p', def: "observed proportion, x/m" }
        - { s: 'm', def: "denominator of the proportion (a + c, b + d, a + b, c + d or n)" }
      nota: "Wilson (1927) interval, the default for every proportion; the selector offers Clopper-Pearson, Agresti-Coull, Jeffreys and Wald (see the \"CI for a proportion\" calculator)."
  etiquetas:
    vp: "True positives (TP)"
    fp: "False positives (FP)"
    fn: "False negatives (FN)"
    vn: "True negatives (TN)"
    nivel: "Confidence level"
    metodo: "CI method for proportions"
    "metodo.wilson": "Wilson (score)"
    "metodo.clopper-pearson": "Clopper-Pearson (exact)"
    "metodo.agresti-coull": "Agresti-Coull"
    "metodo.jeffreys": "Jeffreys"
    "metodo.wald": "Wald (asymptotic)"
    corr: "Haldane-Anscombe correction (ratios)"
    "corr.0": "No correction"
    "corr.0.5": "Add 0.5 to each cell"
