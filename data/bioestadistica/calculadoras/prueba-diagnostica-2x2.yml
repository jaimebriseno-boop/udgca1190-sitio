  ayudas:
    metodo: "Wilson is the recommended method (Newcombe 1998). Wald is for teaching purposes only."
    corr: "Use it when a cell is 0: adds 0.5 to the four cells before computing LR+, LR− and DOR (it does not affect Sn, Sp or the predictive values)."
  interpretacion:
    resumen: "Of {n} participants, {vp} + {fn} had the disease and {fp} + {vn} did not (sample prevalence: {prev}). The test detects {sn} of the people with the disease (sensitivity; {nivel} CI: {sn_ic}) and correctly rules out {sp} of those without it (specificity; {nivel} CI: {sp_ic}). Overall accuracy: {exactitud} ({nivel} CI: {exactitud_ic})."
    "lr_pos.grande": "LR+ = {lr_pos} ({lr_pos_ic}): a positive result multiplies the pre-test odds by {lr_pos}, a large and often conclusive change in the probability of disease (Jaeschke 1994)."
    "lr_pos.moderado": "LR+ = {lr_pos} ({lr_pos_ic}): a positive result multiplies the pre-test odds by {lr_pos}, a moderate change in the probability of disease (Jaeschke 1994)."
    "lr_pos.pequeno": "LR+ = {lr_pos} ({lr_pos_ic}): a positive result multiplies the pre-test odds by {lr_pos}, a small but sometimes important change in probability (Jaeschke 1994)."
    "lr_pos.minimo": "LR+ = {lr_pos} ({lr_pos_ic}): a positive result barely changes the probability of disease (rarely important, Jaeschke 1994)."
    "lr_pos.nulo": "LR+ = {lr_pos} ({lr_pos_ic}): a positive result does not increase the probability of disease; at this value the test does not discriminate (or the table is inverted)."
    "lr_neg.grande": "LR− = {lr_neg} ({lr_neg_ic}): a negative result divides the pre-test odds by {lr_neg}, that is, it greatly lowers the probability of disease and is often enough to rule it out at moderate pre-test probabilities (Jaeschke 1994)."
    "lr_neg.moderado": "LR− = {lr_neg} ({lr_neg_ic}): a negative result moderately lowers the probability of disease (Jaeschke 1994)."
    "lr_neg.pequeno": "LR− = {lr_neg} ({lr_neg_ic}): a negative result lowers the probability of disease only slightly, though sometimes meaningfully (Jaeschke 1994)."
    "lr_neg.minimo": "LR− = {lr_neg} ({lr_neg_ic}): a negative result barely lowers the probability of disease; it cannot rule it out (Jaeschke 1994)."
    "lr_neg.nulo": "LR− = {lr_neg} ({lr_neg_ic}): a negative result does not lower the probability of disease; at this value the test does not discriminate (or the table is inverted)."
    predictivos: "In this sample, {vpp} of positives had the disease (PPV; {nivel} CI: {vpp_ic}) and {vpn} of negatives did not (NPV; {nivel} CI: {vpn_ic}). Both figures depend on prevalence ({prev}) and do not transfer to other populations; in a case-control design they are not valid. For another prevalence use the \"Predictive values\" calculator."
    dor: "DOR = {dor} ({dor_ic}): the odds of a positive result are {dor} times higher in people with the disease than in those without it. Youden's index J = {youden} ({nivel} CI: {youden_ic}); J = 1 would be a perfect test and J = 0 a worthless one."
    "dor.indefinido": "DOR = {dor}: with a cell at 0 the diagnostic odds ratio is undefined (0 or infinite) and has no interval; apply the Haldane-Anscombe correction to obtain a finite estimate. Youden's index J = {youden} ({nivel} CI: {youden_ic})."
    metodos_haldane: "Likelihood ratios and the diagnostic odds ratio were computed after adding 0.5 to each cell of the table (Haldane-Anscombe correction) [{ref:haldane1956},{ref:anscombe1956}]."
  avisos:
    celda_cero: "One cell is 0: LR+, LR− or DOR become 0 or infinite and have no interval. You can apply the Haldane-Anscombe correction (add 0.5 to each cell) in the selector; report it if you use it."
    haldane_aplicado: "Haldane-Anscombe correction applied: LR+, LR− and DOR were computed with 0.5 added to each cell. Sn, Sp, predictive values and J do not change. Report it in Methods."
    n_pequeno: "Small groups ({enfermos} with the disease, {sanos} without it): with fewer than 10 per group the intervals are very wide and the estimates unstable."
    prev_extrema: "Sample prevalence is below 5% or above 95%: predictive values are uninformative and the minority group contributes few data."
    wald_no_recomendado: "A cell has fewer than 5 observations: the Wald interval may fall outside [0, 1] and should not be reported; prefer Wilson or Jeffreys."
    tabla_invertida: "LR+ below 1 or LR− above 1: a positive result lowers the probability of disease. Check the orientation of the table (rows = test, columns = reference standard)."
  metodos: "Sensitivity, specificity, predictive values, accuracy, Youden's index, likelihood ratios (LR+ and LR−) and the diagnostic odds ratio (DOR) were computed from the 2×2 table against the reference standard [{ref:yerushalmy1947},{ref:youden1950}]. The {nivel} confidence intervals of the proportions were obtained with the {metodo_nombre} method {metodo_refs}; those of the likelihood ratios with the logarithmic method of Simel et al. [{ref:simel1991}]; that of the DOR with Woolf's method [{ref:woolf1955},{ref:glas2003}], and that of Youden's index by the delta method.{nota_corr} Calculations used the \"{titulo_corto}\" calculator of Bioestadística abierta (Research Group UDG-CA-1190, {url}), verified against R (binom package)."
  ejemplo_descripcion: "Illustrative example: rapid NS1 antigen test versus RT-PCR for dengue in 200 febrile patients: 68 true positives, 6 false positives, 12 false negatives and 114 true negatives (fictitious data)."
  grafica_titulo: "Estimates with their confidence interval: proportions (top) and ratios on a log scale (bottom)"
