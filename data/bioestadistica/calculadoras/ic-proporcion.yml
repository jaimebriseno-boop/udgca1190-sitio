# Calculadora D3 · Intervalo de confianza de una proporción (seis métodos).
# Bloque neutro (entradas, ejemplo, R, referencias) + bloques es:/en: de forma idéntica.
grupo: acuerdo
orden: 1
estado: activa
motor: ts
entradas:
  - { id: x, tipo: entero, min: 0 }
  - { id: n, tipo: entero, min: 1 }
  - { id: nivel, tipo: proporcion, min: 0.8, max: 0.999, requerido: false }
ejemplo: { x: 68, n: 80, nivel: 0.95 }
r:
  paquetes: [binom, jsonlite]
  codigo: |
    # Confidence interval for a proportion (six methods) - Bioestadistica abierta, UDG-CA-1190
    # Runs as is in R, RStudio or webR; prints the results as JSON at the end.
    library(binom)      # Wilson (default), Clopper-Pearson ("exact"), Agresti-Coull and Wald ("asymptotic")
    library(jsonlite)

    x <- {x}; n <- {n}; nivel <- {nivel}
    alfa <- 1 - nivel; z <- qnorm(1 - alfa / 2); p <- x / n

    ic <- function(m) { r <- binom.confint(x, n, conf.level = nivel, methods = m); c(p, r$lower, r$upper) }
    wilson          <- ic("wilson")
    clopper_pearson <- ic("exact")
    agresti_coull   <- ic("agresti-coull")
    wald            <- ic("asymptotic")
    # Wilson with continuity correction (Newcombe 1998, method 4); 0 and 1 at the boundaries
    wcc_lo <- if (x == 0) 0 else max(0, (2 * n * p + z^2 - 1 - z * sqrt(z^2 - 2 - 1 / n + 4 * p * (n * (1 - p) + 1))) / (2 * (n + z^2)))
    wcc_hi <- if (x == n) 1 else min(1, (2 * n * p + z^2 + 1 + z * sqrt(z^2 + 2 - 1 / n + 4 * p * (n * (1 - p) - 1))) / (2 * (n + z^2)))
    wilson_cc <- c(p, wcc_lo, wcc_hi)
    # Jeffreys, equal-tailed (Brown, Cai & DasGupta 2001); binom's "bayes" method is HPD and differs
    jeffreys <- c(p, if (x == 0) 0 else qbeta(alfa / 2, x + 0.5, n - x + 0.5),
                     if (x == n) 1 else qbeta(1 - alfa / 2, x + 0.5, n - x + 0.5))

    res <- list(p = p, wilson = wilson, wilson_cc = wilson_cc, clopper_pearson = clopper_pearson,
                agresti_coull = agresti_coull, jeffreys = jeffreys, wald = wald)
    cat(toJSON(res, auto_unbox = TRUE, digits = NA))

    # Equivalent in RStudio (not run in the browser):
    # DescTools::BinomCI(x, n, conf.level = nivel, method = c("wilson", "wilsoncc", "clopper-pearson", "agresti-coull", "jeffreys", "wald"))
referencias:
  - { key: wilson1927, rol: original }
  - { key: clopper1934, rol: original }
  - { key: agresti1998, rol: original }
  - { key: newcombe1998, rol: original }
  - { key: brown2001, rol: complementaria }
  - { key: altman2000, rol: didactica }
grafica: ic-forest
es:
  titulo: "Intervalo de confianza de una proporción: Wilson, Clopper-Pearson, Agresti-Coull, Jeffreys y Wald"
  titulo_corto: "IC de una proporción"
  meta: "Calcula el intervalo de confianza de una proporción con seis métodos (Wilson, Wilson con corrección, Clopper-Pearson, Agresti-Coull, Jeffreys y Wald), compara su amplitud y muestra el código R equivalente. Los datos no salen del navegador."
  intro: "Captura cuántos casos presentan la característica (x) de un total (n) y obtén la proporción con su intervalo de confianza por seis métodos, la comparación entre ellos, la interpretación en lenguaje llano y el código de R equivalente."
  explicacion:
    - "Una proporción observada (x de n) es solo una estimación de la proporción en la población. El intervalo de confianza expresa la incertidumbre de esa estimación: si repitiéramos el estudio muchas veces, el 95 % de los intervalos construidos así contendrían la proporción verdadera."
    - "El intervalo de Wald, el que aparece en casi todos los libros de texto, se comporta mal cuando la muestra es pequeña o la proporción se acerca a 0 o a 1: puede salirse de [0, 1] y, con x = 0 o x = n, colapsa a un punto. Por eso la recomendación actual (Newcombe 1998; Brown, Cai y DasGupta 2001) es usar el método de Wilson, o Jeffreys, y reservar Clopper-Pearson para cuando se exige garantía de cobertura."
    - "Esta calculadora muestra los seis métodos a la vez para que se vea dónde coinciden y dónde no; la amplitud de cada intervalo permite compararlos de un vistazo."
  ecuaciones:
    - id: wald
      tex: '\hat p \pm z_{1-\alpha/2}\sqrt{\frac{\hat p\,(1-\hat p)}{n}}'
      simbolos:
        - { s: '\hat p', def: "proporción observada, x/n" }
        - { s: 'z_{1-\alpha/2}', def: "cuantil normal del nivel de confianza (1.96 al 95 %)" }
        - { s: 'n', def: "tamaño de la muestra" }
      nota: "Intervalo de Wald (asintótico). Didáctico; no recomendado con n pequeño o proporciones extremas."
    - id: wilson
      tex: '\frac{\hat p + \frac{z^2}{2n} \pm z\sqrt{\frac{\hat p\,(1-\hat p)}{n} + \frac{z^2}{4n^2}}}{1 + \frac{z^2}{n}}'
      simbolos: []
      nota: "Intervalo de Wilson (1927), también llamado «de score». Es el método recomendado por defecto."
    - id: agresti_coull
      tex: '\tilde n = n + z^2,\qquad \tilde p = \frac{x + z^2/2}{\tilde n},\qquad \tilde p \pm z\sqrt{\frac{\tilde p\,(1-\tilde p)}{\tilde n}}'
      simbolos: []
      nota: "Agresti y Coull (1998): un Wald «ajustado» que añade z² pseudo-observaciones (≈ 2 éxitos y 2 fracasos al 95 %)."
    - id: clopper_pearson
      tex: '\left[\, B_{\alpha/2}(x,\; n-x+1),\ \ B_{1-\alpha/2}(x+1,\; n-x) \,\right]'
      simbolos:
        - { s: 'B_{q}(a, b)', def: "cuantil q de la distribución beta con parámetros a y b" }
      nota: "Clopper y Pearson (1934), «exacto»: garantiza la cobertura nominal a costa de ser conservador. Con x = 0 el límite inferior es 0; con x = n, el superior es 1."
    - id: jeffreys
      tex: '\left[\, B_{\alpha/2}\!\left(x+\tfrac{1}{2},\; n-x+\tfrac{1}{2}\right),\ \ B_{1-\alpha/2}\!\left(x+\tfrac{1}{2},\; n-x+\tfrac{1}{2}\right) \,\right]'
      simbolos: []
      nota: "Intervalo de Jeffreys de colas iguales (Brown, Cai y DasGupta 2001), con 0 y 1 como límites en los extremos."
    - id: wilson_cc
      tex: 'L = \frac{2n\hat p + z^2 - 1 - z\sqrt{z^2 - 2 - \frac{1}{n} + 4\hat p\,(n(1-\hat p)+1)}}{2\,(n+z^2)},\qquad U = \frac{2n\hat p + z^2 + 1 + z\sqrt{z^2 + 2 - \frac{1}{n} + 4\hat p\,(n(1-\hat p)-1)}}{2\,(n+z^2)}'
      simbolos: []
      nota: "Wilson con corrección de continuidad (Newcombe 1998, método 4); L = 0 si x = 0 y U = 1 si x = n."
  etiquetas:
    x: "Casos con la característica (x)"
    n: "Total de observaciones (n)"
    nivel: "Nivel de confianza"
    p: "Proporción observada"
    wilson: "Wilson (score)"
    wilson_cc: "Wilson con corrección de continuidad"
    clopper_pearson: "Clopper-Pearson (exacto)"
    agresti_coull: "Agresti-Coull"
    jeffreys: "Jeffreys"
    wald: "Wald (asintótico)"
    amplitud: "Amplitud del intervalo"
  ayudas:
    x: "Número de observaciones con la característica de interés (entero de 0 a n)."
    n: "Número total de observaciones (entero mayor que 0)."
    nivel: "Habitualmente 95 %; también 90 % o 99 %."
  interpretacion:
    resumen: "{x} de {n} observaciones presentan la característica: {p}. Con {nivel} de confianza, la proporción en la población está entre {wilson_lo} y {wilson_hi} (método de Wilson, recomendado)."
    comparacion.similares: "Con n = {n} y una proporción alejada de 0 y de 1, los seis métodos coinciden casi por completo: la amplitud va de {amplitud_min} a {amplitud_max} puntos porcentuales. La elección del método apenas cambia la conclusión."
    comparacion.difieren: "Los métodos difieren de forma apreciable (amplitud de {amplitud_min} a {amplitud_max} puntos porcentuales): con muestras pequeñas o proporciones cercanas a 0 o a 1 conviene reportar Wilson o Jeffreys y evitar Wald (Brown, Cai y DasGupta 2001)."
    extremo: "Como x vale 0 o es igual a n, el intervalo de Wald colapsa a un punto y no es válido; Wilson, Jeffreys y Clopper-Pearson sí dan un límite informativo."
  avisos:
    wald_invalido: "x = 0 o x = n: el intervalo de Wald colapsa a un punto y no debe reportarse."
    wald_no_recomendado: "Hay menos de 5 casos en alguna de las dos categorías: el intervalo de Wald puede salirse de [0, 1]; prefiere Wilson o Jeffreys."
    n_pequeno: "Con n < 40, Brown, Cai y DasGupta (2001) recomiendan Wilson o Jeffreys; Clopper-Pearson es válido pero conservador."
  metodos: "El intervalo de confianza al {nivel} de la proporción ({x}/{n} = {p}) se calculó con el método de Wilson [{ref:wilson1927},{ref:newcombe1998}]: {wilson_lo} a {wilson_hi}. Los métodos alternativos (Clopper-Pearson [{ref:clopper1934}], Agresti-Coull [{ref:agresti1998}], Jeffreys [{ref:brown2001}]) se calcularon con fines comparativos. Los cálculos se realizaron con la calculadora «{titulo_corto}» de Bioestadística abierta (Cuerpo Académico UDG-CA-1190, {url}), verificada contra R (paquete binom)."
  ejemplo_descripcion: "Ejemplo ilustrativo: 68 de 80 pacientes febriles con prueba de antígeno NS1 positiva resultaron positivos por RT-PCR para dengue (datos ficticios)."
  grafica_titulo: "Intervalo de confianza de la proporción según el método"
en:
  titulo: "Confidence interval for a proportion: Wilson, Clopper-Pearson, Agresti-Coull, Jeffreys and Wald"
  titulo_corto: "CI for a proportion"
  meta: "Compute the confidence interval for a proportion with six methods (Wilson, continuity-corrected Wilson, Clopper-Pearson, Agresti-Coull, Jeffreys and Wald), compare their widths and see the equivalent R code. Data never leave the browser."
  intro: "Enter how many cases show the characteristic (x) out of a total (n) and get the proportion with its confidence interval by six methods, a comparison among them, a plain-language interpretation and the equivalent R code."
  explicacion:
    - "An observed proportion (x of n) is only an estimate of the proportion in the population. The confidence interval expresses the uncertainty of that estimate: if the study were repeated many times, 95% of the intervals built this way would contain the true proportion."
    - "The Wald interval, the one in almost every textbook, misbehaves when the sample is small or the proportion is close to 0 or 1: it can fall outside [0, 1] and, with x = 0 or x = n, it collapses to a single point. That is why current recommendations (Newcombe 1998; Brown, Cai and DasGupta 2001) favour the Wilson method, or Jeffreys, and reserve Clopper-Pearson for when guaranteed coverage is required."
    - "This calculator shows all six methods side by side so you can see where they agree and where they do not; the width of each interval lets you compare them at a glance."
  ecuaciones:
    - id: wald
      tex: '\hat p \pm z_{1-\alpha/2}\sqrt{\frac{\hat p\,(1-\hat p)}{n}}'
      simbolos:
        - { s: '\hat p', def: "observed proportion, x/n" }
        - { s: 'z_{1-\alpha/2}', def: "normal quantile for the confidence level (1.96 at 95%)" }
        - { s: 'n', def: "sample size" }
      nota: "Wald (asymptotic) interval. Didactic; not recommended for small n or extreme proportions."
    - id: wilson
      tex: '\frac{\hat p + \frac{z^2}{2n} \pm z\sqrt{\frac{\hat p\,(1-\hat p)}{n} + \frac{z^2}{4n^2}}}{1 + \frac{z^2}{n}}'
      simbolos: []
      nota: "Wilson (1927) interval, also called the score interval. It is the recommended default."
    - id: agresti_coull
      tex: '\tilde n = n + z^2,\qquad \tilde p = \frac{x + z^2/2}{\tilde n},\qquad \tilde p \pm z\sqrt{\frac{\tilde p\,(1-\tilde p)}{\tilde n}}'
      simbolos: []
      nota: "Agresti and Coull (1998): an \"adjusted\" Wald interval that adds z² pseudo-observations (about 2 successes and 2 failures at 95%)."
    - id: clopper_pearson
      tex: '\left[\, B_{\alpha/2}(x,\; n-x+1),\ \ B_{1-\alpha/2}(x+1,\; n-x) \,\right]'
      simbolos:
        - { s: 'B_{q}(a, b)', def: "quantile q of the beta distribution with parameters a and b" }
      nota: "Clopper and Pearson (1934), the \"exact\" interval: guarantees nominal coverage at the cost of being conservative. With x = 0 the lower limit is 0; with x = n, the upper limit is 1."
    - id: jeffreys
      tex: '\left[\, B_{\alpha/2}\!\left(x+\tfrac{1}{2},\; n-x+\tfrac{1}{2}\right),\ \ B_{1-\alpha/2}\!\left(x+\tfrac{1}{2},\; n-x+\tfrac{1}{2}\right) \,\right]'
      simbolos: []
      nota: "Equal-tailed Jeffreys interval (Brown, Cai and DasGupta 2001), with 0 and 1 as limits at the boundaries."
    - id: wilson_cc
      tex: 'L = \frac{2n\hat p + z^2 - 1 - z\sqrt{z^2 - 2 - \frac{1}{n} + 4\hat p\,(n(1-\hat p)+1)}}{2\,(n+z^2)},\qquad U = \frac{2n\hat p + z^2 + 1 + z\sqrt{z^2 + 2 - \frac{1}{n} + 4\hat p\,(n(1-\hat p)-1)}}{2\,(n+z^2)}'
      simbolos: []
      nota: "Wilson with continuity correction (Newcombe 1998, method 4); L = 0 if x = 0 and U = 1 if x = n."
  etiquetas:
    x: "Cases with the characteristic (x)"
    n: "Total observations (n)"
    nivel: "Confidence level"
    p: "Observed proportion"
    wilson: "Wilson (score)"
    wilson_cc: "Wilson with continuity correction"
    clopper_pearson: "Clopper-Pearson (exact)"
    agresti_coull: "Agresti-Coull"
    jeffreys: "Jeffreys"
    wald: "Wald (asymptotic)"
    amplitud: "Interval width"
  ayudas:
    x: "Number of observations with the characteristic of interest (integer from 0 to n)."
    n: "Total number of observations (integer greater than 0)."
    nivel: "Usually 95%; 90% or 99% are also common."
  interpretacion:
    resumen: "{x} of {n} observations show the characteristic: {p}. With {nivel} confidence, the population proportion lies between {wilson_lo} and {wilson_hi} (Wilson method, recommended)."
    comparacion.similares: "With n = {n} and a proportion away from 0 and 1, the six methods agree almost completely: widths range from {amplitud_min} to {amplitud_max} percentage points. The choice of method barely changes the conclusion."
    comparacion.difieren: "The methods differ appreciably (widths from {amplitud_min} to {amplitud_max} percentage points): with small samples or proportions close to 0 or 1, report Wilson or Jeffreys and avoid Wald (Brown, Cai and DasGupta 2001)."
    extremo: "Because x is 0 or equal to n, the Wald interval collapses to a point and is not valid; Wilson, Jeffreys and Clopper-Pearson do give an informative limit."
  avisos:
    wald_invalido: "x = 0 or x = n: the Wald interval collapses to a point and should not be reported."
    wald_no_recomendado: "Fewer than 5 cases in one of the two categories: the Wald interval may fall outside [0, 1]; prefer Wilson or Jeffreys."
    n_pequeno: "With n < 40, Brown, Cai and DasGupta (2001) recommend Wilson or Jeffreys; Clopper-Pearson is valid but conservative."
  metodos: "The {nivel} confidence interval for the proportion ({x}/{n} = {p}) was computed with the Wilson method [{ref:wilson1927},{ref:newcombe1998}]: {wilson_lo} to {wilson_hi}. Alternative methods (Clopper-Pearson [{ref:clopper1934}], Agresti-Coull [{ref:agresti1998}], Jeffreys [{ref:brown2001}]) were computed for comparison. Calculations used the \"{titulo_corto}\" calculator of Bioestadística abierta (Research Group UDG-CA-1190, {url}), verified against R (binom package)."
  ejemplo_descripcion: "Illustrative example: 68 of 80 febrile patients with a positive NS1 antigen test were positive by RT-PCR for dengue (fictitious data)."
  grafica_titulo: "Confidence interval for the proportion by method"
