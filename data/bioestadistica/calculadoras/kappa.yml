  ayudas:
    x: "Copy the table of counts in your spreadsheet and paste it here: one table row per line, cells separated by tabs, commas, semicolons or spaces, so a table copied from a PDF works too. Rows are the categories assigned by rater A and columns those of rater B, in the same order. If you paste the category names as a first row or a first column, they are dropped for you. A note on thousands: in a space-separated table a space always separates cells, so \"1 234\" would read as two cells; write thousands with no separator (1234), or separate the cells with tabs, commas or semicolons. The table must be square, from 2 × 2 up to 10 × 10."
    ponderacion: "Unweighted, every disagreement counts the same: that is the right choice for nominal categories. Linear and quadratic weights give partial credit to neighbouring categories and only make sense if the categories are ordered."
    nivel: "Confidence level of the interval for κ (95% by default). It does not change the test against κ = 0."
  interpretacion:
    "resumen.simple": "The raters agreed on {po} of the {n} cases; the agreement expected by chance was {pe}. κ = {kappa} ({nivel} CI: {kappa_ic}): {banda} agreement beyond chance."
    "resumen.ponderada": "The raters agreed exactly on {po_diagonal} of the {n} cases. With the agreement weights, which give partial credit to neighbouring categories, observed agreement is {po} and chance agreement is {pe}. κ = {kappa} ({nivel} CI: {kappa_ic}): {banda} agreement beyond chance."
    "landis.pobre": "On the Landis and Koch bands, κ = {kappa} is poor agreement: the raters do not agree more than they would if they answered at random with those same frequencies. The interval {kappa_ic} shows how far the uncertainty reaches; before repeating the measurement, review the definition of the categories and the training of those who classify."
    "landis.leve": "On the Landis and Koch bands, κ = {kappa} is slight agreement (0 to 0.20): there is something above chance, but very little. The interval {kappa_ic} shows how far the uncertainty reaches."
    "landis.aceptable": "On the Landis and Koch bands, κ = {kappa} is fair agreement (0.21 to 0.40): it stands apart from chance, but falls well short of what a measurement meant to guide decisions requires. The interval {kappa_ic} shows how far the uncertainty reaches."
    "landis.moderado": "On the Landis and Koch bands, κ = {kappa} is moderate agreement (0.41 to 0.60). The interval {kappa_ic} shows how far the uncertainty reaches: check whether the lower limit is still acceptable for the use you have in mind."
    "landis.sustancial": "On the Landis and Koch bands, κ = {kappa} is substantial agreement (0.61 to 0.80). The interval {kappa_ic} shows how far the uncertainty reaches."
    "landis.casi_perfecto": "On the Landis and Koch bands, κ = {kappa} is almost perfect agreement (0.81 to 1). The interval {kappa_ic} shows how far the uncertainty reaches."
    h0: "z = {z_h0}, p = {p_h0} against κ = 0. The test says whether agreement exceeds chance, not whether agreement is good enough: with large samples a small kappa also comes out significant."
    maximo: "With these marginals the largest possible κ is {kappa_max}: no arrangement of the same row and column totals would give more. The further it falls below 1, the more the result is limited by the two raters using the categories with different frequencies."
    "k2.si": "With two categories you can also read PABAK = {pabak}, the observed agreement rescaled, which does not depend on prevalence; the prevalence index {indice_prevalencia}, which measures how unequal the two agreement cells are; and the bias index {indice_sesgo}, which measures how much the raters differ in how often they use each category. Report PABAK alongside κ, not instead of it."
    "k2.no": "PABAK and the prevalence and bias indices are defined only with two categories; this table has {k}."
    "paradoja.si": "Careful: observed agreement is {po} and still κ = {kappa}. This is the kappa paradox: one category holds almost every case, the agreement expected by chance rises to {pe} and barely any room is left above it. Report observed agreement alongside κ, and do not read this low κ as proof that the measurement is useless."
    "paradoja.no": "Observed agreement ({po}) and κ ({kappa}) point the same way: there is no sign of the kappa paradox, which appears when one category holds almost every case and chance agreement shoots up."
    "ponderacion.ninguna": "Unweighted κ: every disagreement counts the same, whether between neighbouring categories or between the extremes. That is the right choice when the {k} categories have no order."
    "ponderacion.lineal": "κ weighted with linear weights: a disagreement between neighbouring categories costs less than one between the extremes, in proportion to the distance. It only makes sense if the {k} categories are ordered and the steps between them are comparable."
    "ponderacion.cuadratica": "κ weighted with quadratic weights: large disagreements count far more than small ones. It only makes sense if the {k} categories are ordered; with equally spaced categories this version coincides with the intraclass correlation coefficient."
    "metodos_ponderacion.ninguna": "unweighted"
    "metodos_ponderacion.lineal": "with linear weights [{ref:cohen1968}]"
    "metodos_ponderacion.cuadratica": "with quadratic weights [{ref:cohen1968}]"
    "metodos_byrt.si": "; with two categories the prevalence-adjusted bias-adjusted kappa (PABAK) and the prevalence and bias indices were added [{ref:byrt1993}], and the largest κ compatible with the observed marginals is also reported"
    "metodos_byrt.no": "; the largest κ compatible with the observed marginals is also reported"
  avisos:
    categoria_vacia: "Some categories have no observation at all, neither in their row nor in their column: they were dropped before computing κ and the table came down to {k} × {k}. The agreement weights depend on how many categories there are, so keeping them would change the result."
    paradoja: "High observed agreement with a low κ: this is the kappa paradox, which appears when one category holds almost every case and chance agreement shoots up. Report observed agreement alongside κ and, with two categories, PABAK, which corrects for that effect; the figures are in the interpretation."
    ponderada_ordinal: "Agreement weights assume the categories are ordered: a disagreement between neighbours counts as partial agreement. That only makes sense with ordinal categories, such as grades of severity; with nominal categories, use unweighted κ."
    n_pequeno: "Only {n} cases: the standard error of κ is asymptotic, so the interval is approximate and very wide. Interpret with caution."
    cortes: "The Landis and Koch bands (poor, slight, fair, moderate, substantial, almost perfect) are conventional cut-offs, not derived from theory, and they mark no threshold of validity. Interpret κ together with its confidence interval and with the observed agreement."
  metodos: "Interobserver agreement was assessed with Cohen's kappa coefficient [{ref:cohen1960}] ({ponderacion_frase}) with a {nivel} CI based on the asymptotic standard error of Fleiss, Cohen and Everitt [{ref:fleiss1969}]; its magnitude was interpreted following Landis and Koch [{ref:landis1977}]{frase_byrt}. {n} cases were classified into {k} categories and κ = {kappa} ({nivel} CI {kappa_ic}) was obtained, with an observed agreement of {po}. Calculations used the \"{titulo_corto}\" calculator of Bioestadística abierta (Research Group UDG-CA-1190, {url}), verified against R (irr::kappa2)."
  ejemplo_descripcion: "Illustrative example: two clinicians independently classify 100 dengue cases as \"no warning signs\", \"with warning signs\" and \"severe\" (fictitious data, not real)."
  grafica_titulo: "Cohen's kappa with its confidence interval, against chance agreement"
