    curva_poder: "Exact power (non-central t)"
    marcador_n: "chosen n"
    referencia_poder: "Target power"
  ayudas:
    delta: "The smallest difference between the two group means that would change a clinical decision, in the units of the outcome. The sign does not change the result."
    sigma: "Standard deviation of the outcome, assumed equal in both groups. Take it from a previous study or a pilot and state where it came from."
    alfa: "Probability of concluding there is a difference when there is none. Conventionally 0.05; values from 0.001 to 0.20 are allowed."
    lateralidad: "Two-sided detects differences in either direction and is the usual choice. One-sided only makes sense if a single direction is of interest and that was decided before collecting the data."
    poder: "Probability of detecting the difference if it really exists. Conventionally 0.80 or 0.90; values from 0.50 to 0.99 are allowed."
    r: "How many group 2 participants per group 1 participant. With 1 the groups are equal, which is the most efficient; with 2 there are twice as many in group 2."
    perdidas: "Proportion of participants expected to be lost during follow-up. The total is divided by (1 − losses). Leave it empty if you do not want the adjustment."
    n_dado: "Optional. If you already know how many participants you can recruit into group 1, type it here and the calculator will tell you what power you would reach. Leave it empty (or 0) for the usual calculation."
  interpretacion:
    resumen: "To detect a mean difference of {delta} (in the units of the outcome; Cohen's d = {d_cohen}) with {poder} power and α = {alfa} ({lateralidad_texto}), {n1_techo} participants are required in group 1 and {n2_techo} in group 2, that is {n_total_techo} in total."
    aproximacion: "The normal formula with Guenther's correction gives {n1_normal_techo} per group; the exact non-central t solution is the one reported, and the one the calculation rests on."
    comparacion.r1: "With equal groups the result matches R's power.t.test(delta = {delta}, sd = {sigma}, sig.level = {alfa}, power = {poder_dec}, type = \"two.sample\"), which returns {n_ptt_techo} per group."
    comparacion.r: "With an allocation ratio of {r} the groups are not equal and power.t.test does not apply: the same non-central t equation is solved with n₂ = {r}·n₁, using the same root finder and the same tolerance."
    perdidas.con: "Allowing for {perdidas} losses, the recruitment target rises to {n_ajustado_techo} participants in total, {n1_ajustado_techo} and {n2_ajustado_techo} per group, to finish the study with the {n_total_techo} the calculation requires."
    perdidas.sin: "The calculation assumes no losses: if you expect dropouts during follow-up, enter them so the total includes the replacements."
    inverso.con: "With the {n_dado} group 1 participants you already have (and {n_dado_2} in group 2), the actual power would be {poder_dado}; the normal approximation would give {poder_dado_normal}."
    inverso.sin: "If you already know how many participants you can recruit, type it into \"inverse mode\" and you will see what power that figure would reach."
    metodos_perdidas.con: "A further {perdidas} was added for expected losses, bringing the total to recruit up to {n_ajustado_techo}."
    metodos_perdidas.sin: "No losses to follow-up were anticipated."
  avisos:
    supuestos: "The figures depend entirely on the assumptions you entered (the difference that matters and the standard deviation): take them from previous studies or a pilot and state their origin in the protocol."
    n_pequeno: "The calculation asks for fewer than 10 participants per group ({n1}): with samples that small the t test leans heavily on the normality assumption, and the assumptions deserve a second look before fixing the sample size."
    unilateral: "The test is one-sided: this only makes sense if a single direction of effect is of interest and that was decided before collecting the data. Declaring it after seeing the results is a questionable practice."
    r_distinto: "The allocation ratio is {r}, so the groups will not be equal. power.t.test does not cover that case: the calculator solves the same non-central t equation with n₂ = r·n₁. Unequal allocation always needs more participants in total than an even split."
    delta_grande: "The difference you are asking to detect exceeds two standard deviations: that is an enormous effect, rarely seen in clinical research. Check that the difference and the standard deviation are in the same units."
  metodos: "The sample size was computed to compare the means of two independent groups, assuming a minimum difference of interest of {delta} in the units of the outcome and a common standard deviation of {sigma} (Cohen's d = {d_cohen}), with α = {alfa} ({lateralidad_texto}) and {poder} power [{ref:neyman1933}], using the exact solution based on the non-central t distribution [{ref:student1908}], equivalent to R's power.t.test; the normal approximation with Guenther's correction [{ref:guenther1981}] is reported for comparison and the effect-size convention follows Cohen [{ref:cohen1988}, {ref:lachin1981}]. This requires {n1_techo} and {n2_techo} participants per group ({n_total_techo} in total). {perdidas_frase} The procedure follows standard design recommendations [{ref:altman1991}, {ref:hulley2013}, {ref:chow2018}]. Calculations used the \"{titulo_corto}\" calculator of Bioestadística abierta (Research Group UDG-CA-1190, {url}), verified against R."
  ejemplo_descripcion: "Illustrative example: detecting a 1-day difference in mean hospital stay between two treatments, with a standard deviation of 3 days, α = 0.05 two-sided, 80% power and 10% expected losses (fictitious data)."
  grafica_titulo: "Power against the size of group 1"
