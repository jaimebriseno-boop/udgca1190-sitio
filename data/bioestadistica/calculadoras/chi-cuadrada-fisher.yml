    "tabla.fila2": "Group 2 (unexposed)"
    "tabla.columnas": "Outcome"
    "tabla.col1": "Yes"
    "tabla.col2": "No"
    "tabla.total": "Total"
    n: "Total participants (n)"
    e_a: "Expected in a"
    e_b: "Expected in b"
    e_c: "Expected in c"
    e_d: "Expected in d"
    e_min: "Smallest expected frequency"
    chi2: "Pearson's χ²"
    p_chi2: "p (Pearson's χ²)"
