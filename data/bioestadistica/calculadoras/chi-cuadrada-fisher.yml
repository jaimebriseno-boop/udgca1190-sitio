  ayudas:
    nivel: "Level of the confidence interval for the conditional odds ratio. It changes no p value."
    a: "The four counts are people, not percentages. Every row and every column must add up to at least 1."
  interpretacion:
    resumen: "The proportion with the outcome was {p1} in group 1 versus {p0} in group 2 (n = {n})."
    "prueba.pearson": "Recommended test: Pearson's chi-squared without correction, p = {p}. Every expected frequency reaches 5 and the total is at least 20, so the chi-squared approximation is adequate (Cochran's rule)."
    "prueba.fisher": "Recommended test: Fisher's two-sided exact test, p = {p}. Some expected frequency falls below 5 or the total is under 20, and with such counts the chi-squared approximation is doubtful (Cochran's rule)."
    "decision.rechaza": "p = {p}; at α = 0.05 the null hypothesis of independence between group and outcome is rejected. The size of the association and its confidence interval matter more than the p value."
    "decision.no_rechaza": "p = {p}; at α = 0.05 the null hypothesis of independence between group and outcome is not rejected: the data are compatible with no association, which is not the same as showing there is none. The size of the association and its confidence interval matter more than the p value."
    "phi.trivial": "φ = {phi}: a trivial association, {sentido}, by Cohen's convention (|φ| below 0.1). These are conventional cut-offs, not results derived from theory."
    "phi.pequeno": "φ = {phi}: a small association, {sentido}, by Cohen's convention (|φ| between 0.1 and 0.3). These are conventional cut-offs, not results derived from theory."
    "phi.mediano": "φ = {phi}: a medium association, {sentido}, by Cohen's convention (|φ| between 0.3 and 0.5). These are conventional cut-offs, not results derived from theory."
    "phi.grande": "φ = {phi}: a large association, {sentido}, by Cohen's convention (|φ| of 0.5 or more). These are conventional cut-offs, not results derived from theory."
    or_cond: "Conditional odds ratio: {or_cond} ({nivel} CI: {or_cond_ic}). It is the maximum likelihood estimate that accompanies Fisher's exact test, the one coherent with its p value. For the usual odds ratio (ad/bc) with Woolf's interval, use the \"Association and effect (2×2 table)\" calculator."
    comparacion: "The three versions of the chi-squared test give: Pearson without correction χ² = {chi2} (p = {p_chi2}); with Yates' correction χ² = {chi2_yates} (p = {p_yates}); the N−1 variant χ² = {chi2_n1} (p = {p_n1}). Yates' correction is conservative: it lowers the statistic and raises the p value more than necessary, so it is not recommended as a matter of routine. With small expected frequencies Fisher's exact test is preferable and, if an approximation is wanted, Campbell's N−1 variant (2007) matches the nominal size better."
  avisos:
    esperados_bajos: "The smallest expected frequency is {e_min}, below 5: the chi-squared approximation is doubtful and Fisher's exact test is reported instead (Cochran's rule)."
    n_pequeno: "The total is {n} participants, fewer than 20: use Fisher's exact test; the chi-squared approximation is not reliable with so few data."
    yates_cero: "|ad − bc| is smaller than n/2: Yates' correction, bounded as in R, leaves the corrected statistic at 0 and its p value at 1. This is not an error, it is what chisq.test does."
    or_cond_borde: "Cell a sits at an end of the hypergeometric support (there is at least one relevant zero): the conditional odds ratio is 0 or infinite and one limit of the interval is not finite. Fisher's p value and the phi coefficient remain valid."
  metodos: "The association between the two variables of the 2×2 table ({factor} and {desenlace}) was assessed with Pearson's chi-squared test [{ref:pearson1900}] (Yates' continuity correction [{ref:yates1934}] and the N−1 variant [{ref:campbell2007}] are also reported) or with Fisher's two-sided exact test [{ref:fisher1934},{ref:fisher1935}] when any expected frequency was below 5 or the total was below 20 (Cochran's rule [{ref:cochran1954}]); for these data {prueba_nombre} is recommended. The strength of the association was summarised with the phi coefficient [{ref:yule1912}], read with Cohen's convention [{ref:cohen1988}], and with the conditional odds ratio of Fisher's test and its {nivel} confidence interval [{ref:fisher1935}]. Calculations used the \"{titulo_corto}\" calculator of Bioestadística abierta (Research Group UDG-CA-1190, {url}), verified against R (chisq.test, fisher.test)."
  ejemplo_descripcion: "Illustrative example: early versus late hydration in 200 patients with dengue; 12 of 100 with early hydration and 30 of 100 with late hydration progressed to severe dengue (fictitious data)."
  grafica_titulo: "Observed and expected frequencies under independence, cell by cell"
