    x: "Column of values (one variable)"
    nivel: "Confidence level"
    n: "Values (n)"
    media: "Mean"
    de: "Standard deviation (SD)"
    eem: "Standard error of the mean (SEM)"
    mediana: "Median"
    q1: "First quartile (Q₁)"
    q3: "Third quartile (Q₃)"
    iqr: "Interquartile range (IQR)"
    min: "Minimum"
    max: "Maximum"
    rango: "Range"
    cv: "Coefficient of variation (CV)"
    g1: "Skewness (G1)"
    g2: "Kurtosis (G2)"
    media_geom: "Geometric mean"
    sw_w: "Shapiro-Wilk (W)"
    sw_p: "Shapiro-Wilk (p)"
    n_atipicos: "Outliers (Tukey)"
    nota_t: "t distribution"
    nota_cuantil: "type 7 quantile"
    nota_joanes: "Joanes and Gill, type 2"
    nota_shapiro: "AS R94 (Royston 1995)"
    nota_tukey: "1.5 × IQR fences"
    eje_x: "Value of the variable"
    eje_frecuencia: "Frequency"
    grafica_normal: "Fitted normal curve"
    grafica_media: "Mean"
  ayudas:
    x: "Copy the column in your spreadsheet (Excel, Google Sheets, Numbers) and paste it here: one value per row. Values separated by tabs, commas or semicolons also work, and the decimal comma is recognised. A header row and any non-numeric text are dropped with a notice."
    nivel: "Confidence level of the interval for the mean (95% by default). It does not change the other descriptive statistics."
  interpretacion:
    resumen: "{n} values were described: mean {media} (SD {de}; {nivel} CI for the mean {media_ic}), median {mediana} (IQR {q1} to {q3}), range {min} to {max}. The standard error of the mean is {eem} and the coefficient of variation {cv}."
    "asimetria.simetrica": "Skewness G1 = {g1}: the distribution is roughly symmetric; kurtosis G2 = {g2}, where 0 corresponds to the normal, positive values to heavier tails and negative values to a flatter shape."
    "asimetria.derecha": "Skewness G1 = {g1}: the distribution has a right tail, that is, a few high values pulling the mean ({media}) above the median ({mediana}); kurtosis G2 = {g2}, where 0 corresponds to the normal."
    "asimetria.izquierda": "Skewness G1 = {g1}: the distribution has a left tail, that is, a few low values pulling the mean ({media}) below the median ({mediana}); kurtosis G2 = {g2}, where 0 corresponds to the normal."
    "normalidad.sin_evidencia": "Shapiro-Wilk: W = {sw_w}, p = {sw_p}: there is no evidence against normality in these {n} values. The test does not prove that the variable is normal, only that these data are not enough to rule it out; with large n, small p values do not imply relevant departures."
    "normalidad.evidencia": "Shapiro-Wilk: W = {sw_w}, p = {sw_p}: there is evidence against normality in these {n} values. Look at the histogram before concluding: with large n, small p values do not imply relevant departures, and what matters is whether the shape changes the decision to report the mean or the median."
    "normalidad.no_aplica": "The Shapiro-Wilk test was not computed: it needs between 3 and 5,000 values and a column that is not constant; these data fail one of the two conditions (n = {n}). With large n, small p values do not imply relevant departures either: stay with the histogram and the box plot."
    resumen_recomendado: "For the manuscript: report mean (SD) when the distribution is roughly symmetric and free of outliers, that is {media} ({de}); report median (IQR) when it is not, that is {mediana} ({q1} to {q3}). Geometric mean, useful when the variable is multiplicative (titres, viral loads, dilutions): {media_geom}."
    "atipicos.con": "{n_atipicos} values fall outside Tukey's fences (below {cerca_inf} or above {cerca_sup}, that is, more than {k} interquartile ranges away from the box). An outlier is not an error in itself: check the data entry and the units before excluding it, and if you do exclude it, say so."
    "atipicos.sin": "No value falls outside Tukey's fences (below {cerca_inf} or above {cerca_sup}, that is, more than {k} interquartile ranges away from the box)."
  avisos:
    n_pequeno: "Only {n} values: below 3 neither skewness G1 nor the Shapiro-Wilk test is computed, and below 4 kurtosis G2 is not computed either. With so few data the interval for the mean is very wide."
    constante: "All values are identical: the standard deviation is 0, and skewness, kurtosis and the Shapiro-Wilk test are undefined."
    no_positivos: "There are values at or below 0: the geometric mean is undefined."
    atipicos: "{n_atipicos} values fall outside Tukey's fences (more than {k} interquartile ranges below Q₁ or above Q₃). Check for data entry or unit errors before excluding them."
    sw_n_grande: "More than 5,000 values: the Shapiro-Wilk test is not computed, because the AS R94 algorithm is calibrated up to n = 5,000. Use the histogram and the box plot."
    n_grande: "With {n} values the Shapiro-Wilk test detects departures from normality of no practical importance: look at the shape of the distribution before deciding."
  metodos: "Continuous variables were summarised as mean (standard deviation) or median (interquartile range) according to their distribution, assessed with the Shapiro-Wilk test [{ref:shapiro1965},{ref:royston1995}] and visual inspection of the histogram and box plot [{ref:tukey1977}]; quartiles were computed with type 7 of Hyndman and Fan [{ref:hyndman1996}], skewness and kurtosis with the G1 and G2 estimators [{ref:joanes1998}] and the {nivel} confidence interval of the mean with Student's t distribution [{ref:student1908}]. {n} values were described. Calculations used the \"{titulo_corto}\" calculator of Bioestadística abierta (Research Group UDG-CA-1190, {url}), verified against R (mean, sd, quantile with type = 7 and shapiro.test)."
  ejemplo_descripcion: "Illustrative example: platelet count (×10³/µL) in 40 febrile patients, simulated in R with set.seed(1190) and round(rnorm(40, 150, 45)) (fictitious data, not real)."
  grafica_titulo: "Histogram with the fitted normal curve and box plot of the same column"
