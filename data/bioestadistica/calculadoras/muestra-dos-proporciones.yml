  ayudas:
    p1: "Proportion of the outcome you expect in the first group (control or usual care). Take it from previous studies or from a pilot."
    p2: "Proportion you expect in the second group. The difference between p₁ and p₂ is what weighs most on the sample size."
    alfa: "Probability of declaring a difference that does not exist. Write it as a decimal (0.05, not 5)."
    lateralidad: "A two-sided test detects differences in either direction and is the usual choice. A one-sided test needs fewer participants but must be justified before seeing the data."
    poder: "Probability of detecting the difference if it really exists. The conventional value is 0.80; 0.90 or 0.95 for confirmatory studies."
    r: "Participants in group 2 for each one in group 1. With 1 the groups are equal, which is the most efficient split; with 2 there are twice as many in group 2."
    perdidas: "Proportion of participants you expect to lose during follow-up. The total to recruit is divided by one minus this figure."
    n_dado: "Inverse mode: if you already know how many people you can study in group 1, write it here to see the power you reach. Leave it at 0 to skip it."
  interpretacion:
    resumen: "To detect a proportion of {p1} versus one of {p2} with {poder} power and α = {alfa} ({lateralidad}), {n1_techo} participants are required in group 1 and {n2_techo} in group 2, {n_total_techo} in total."
    "correccion.si": "The figure reported carries the continuity correction of Fleiss, Tytun and Ury, which approximates what Fisher's exact test will require: {n1_cc_techo} and {n2_cc_techo} participants. Uncorrected, Fleiss's formula — which approximates Pearson's chi-squared — would ask for {n1_fleiss_techo} and {n2_fleiss_techo}. Report whichever matches the test you will run."
    "correccion.no": "The figure reported is Fleiss's formula without correction, which approximates what Pearson's chi-squared will require: {n1_fleiss_techo} and {n2_fleiss_techo} participants. With the continuity correction of Fleiss, Tytun and Ury, which approximates Fisher's exact test, {n1_cc_techo} and {n2_cc_techo} would be needed. Report whichever matches the test you will run."
    comparacion: "With equal groups, R's power.prop.test solves the same uncorrected equation and returns {n_ppt} per group. Cohen's alternative starts from the arcsine transformation: h = {h_cohen} and {n_pwr_h} per group. They are two approximations to the same problem, so a difference of a few participants is expected."
    "comparacion.r": "With an allocation ratio of {r} the groups are not equal, so power.prop.test and pwr::pwr.2p.test are not computed: both assume n₁ = n₂. The figure comes from Fleiss's formula written out by hand, which does allow any ratio. Cohen's h is {h_cohen} and does not depend on the split."
    "comparacion.sin_solucion": "The groups are equal, but at least one of the two comparisons with R is missing: power.prop.test and pwr::pwr.2p.test search for the solution iteratively within a bounded interval, and with a sample size this extreme the solution falls outside that interval. This is not a flaw in the design and it does not change the figure reported, which comes from Fleiss's formula in closed form. Cohen's h is {h_cohen}."
    "perdidas.con": "Anticipating {perdidas} losses during follow-up, the recruitment target rises to {n_ajustado_techo} participants in total, {n1_ajustado_techo} and {n2_ajustado_techo} per group."
    "perdidas.sin": "No losses to follow-up were anticipated, so the total to recruit is the total computed: {n_total_techo} participants."
    "inverso.con": "With the {n_dado} participants available in group 1 and {n2_dado} in group 2, the power attainable for that same difference would be {poder_dado}, against a target of {poder}."
    "inverso.sin": "If you already know how many people you can study, write that number in the field for available participants and the calculator will report the power you reach with it."
    "metodos_correccion.si": "the Fleiss formula for two independent proportions with the continuity correction of Fleiss, Tytun and Ury [{ref:fleiss1980},{ref:fleiss2003}]"
    "metodos_correccion.no": "the Fleiss formula for two independent proportions, without continuity correction [{ref:fleiss2003},{ref:casagrande1978}]"
    "metodos_perdidas.con": "A further {perdidas} was added for anticipated losses [{ref:lwanga1991}], so that the recruitment target is {n_ajustado_techo} participants."
    "metodos_perdidas.sin": "No losses to follow-up were anticipated."
  avisos:
    supuestos: "These figures depend entirely on the proportions you assumed: take them from previous studies, from a pilot or from the smallest clinically important difference, and document their origin in Methods. A small change in the expected difference changes the sample size a great deal."
    diferencia_minima: "The difference between the two proportions is smaller than one percentage point: the sample size explodes and usually becomes unfeasible. Check that this really is the smallest difference you care about detecting."
    aproximacion_dudosa: "With the computed size, one of the groups would expect fewer than five events or fewer than five non-events. The normal approximation is doubtful there: consider an exact method based on Fisher's test."
    unilateral: "You chose a one-sided test: it asks for fewer participants, but it is only admissible if the hypothesis is directional and was declared before seeing the data. Justify it in the protocol."
    r_distinto: "With an allocation ratio other than 1 the comparisons with power.prop.test and pwr::pwr.2p.test are not shown, because both assume equal groups; the figure comes from Fleiss's formula, which allows any ratio. An unequal split always demands more participants in total than splitting in half."
  metodos: "The sample size was computed to compare two independent proportions ({p1} versus {p2}, allocation ratio {r}), assuming those proportions come from previous studies or from a pilot, with α = {alfa} ({lateralidad}) and {poder} power, using {frase_correccion}; {n1_techo} and {n2_techo} participants per group are required, {n_total_techo} in total. {frase_perdidas} Calculations were carried out with the «{titulo_corto}» calculator from Open Biostatistics (Academic Body UDG-CA-1190, {url}), verified against R."
  ejemplo_descripcion: "Illustrative example: a clinical trial comparing two treatments in patients with dengue with warning signs; cure is expected in 70 % with usual care and in 85 % with the new treatment, with α = 0.05 two-sided, 80 % power, equal groups and 10 % anticipated losses (fictitious data)."
  grafica_titulo: "Power of the test against the number of participants in group 1, with the required size and the target power marked"
