  ayudas:
    tiempo: "Copy the follow-up time column from your spreadsheet: one value per row, in whatever units you use (days, months, years). It is the time to the event for whoever had it and the time to the last observation for whoever did not."
    evento: "A column with as many rows as the time column: 1 if the patient had the event and 0 if they were censored (follow-up closed or lost without the event occurring)."
    grupo: "Optional. A column of numeric codes with as many rows as the other two: without it a single curve is drawn; with it, one curve per group and the log-rank test. At most two groups are supported for now."
    nivel: "Confidence level of the band around the curve, of the median and of S(t). It does not change the log-rank test."
    tipo_ic: "Scale on which the Greenwood interval is built. The log-log scale (the default here) keeps the limits between 0 and 1 and behaves better in the tails; the logarithmic scale is R's own default."
    t1: "Optional. The time at which you want to read survival, in the same units as the time column (7 days, for instance). Leave it empty or at 0 if you do not want to read any time. Beyond the last observed time of a group, S(t) is undefined."
    t2: "Optional. A second reading time, equal to or later than the first; empty or 0 if you do not need it."
  interpretacion:
    "resumen.uno": "In {grupo_1}, the number of patients followed was {n_1} and the number of events observed was {eventos_1}; the longest follow-up reached {seguimiento_1}.{frase_t1}{frase_t2}"
    "resumen.dos": "Two curves were compared: in {grupo_1} the number of patients was {n_1} and the number of events {eventos_1}; in {grupo_2}, {n_2} and {eventos_2}.{frase_t1}{frase_t2}"
    "tiempo.uno": " At time {t}, the estimated probability of still being event-free was {s_1}{ic_1} in {grupo_1}."
    "tiempo.dos": " At time {t}, the estimated probability of still being event-free was {s_1}{ic_1} in {grupo_1} and {s_2}{ic_2} in {grupo_2}."
    "tiempo.parcial": " At time {t}, the estimated probability of still being event-free was {s_1}{ic_1} in {grupo_1}; in {grupo_2} that time is already beyond the observed follow-up."
    "tiempo.fuera": " There is no estimate at time {t}: it lies beyond the observed follow-up, and extending the curve that far would be inventing data."
    "mediana.uno": "Median survival in {grupo_1}: {mediana_1}. It is the time at which the curve crosses 50%, and it is reported instead of the mean because it does not depend on the censored tail."
    "mediana.dos": "Median survival: {mediana_1} in {grupo_1} and {mediana_2} in {grupo_2}. It is the time at which each curve crosses 50%; when a curve ends above 0.5 the median is not reached and must be reported that way, never as the last observed time."
    "logrank.rechaza": "Log-rank test: χ² = {chi2_logrank} with {gl} degree of freedom, p = {p_logrank}. At α = 0.05 the null hypothesis that the two curves are identical is rejected. The p value says the observed difference would be rare if there were none, but not how large it is: that is what the medians, the survival at the times of interest and the gap between the curves say."
    "logrank.no_rechaza": "Log-rank test: χ² = {chi2_logrank} with {gl} degree of freedom, p = {p_logrank}. At α = 0.05 the null hypothesis that the two curves are identical is not rejected. \"Not significant\" is not the same as \"identical\": with few events the interval around the medians is wide and an important difference can go unnoticed."
    "logrank.indefinido": "The log-rank test is not defined for these data: the variance of the statistic is 0, that is, there is no time at which both curves have subjects at risk and events to share between them. That happens when every event falls at the same time, or when one group stops being followed before the first event of the other. Describe the curves and the follow-up times instead of looking for a p value."
    "logrank.uno": "There is no log-rank test: a single group was entered. Comparing requires a group column with two distinct codes."
    "censura.no": "There were no censorings: all {n_tot} patients were followed to the event, so the tail of the curve does not rest on any assumption about losses to follow-up."
    "censura.si": "Follow-up was censored in {censuras_tot} of {n_tot} patients ({pct_censura}); the split by curve was {detalle_censura}. Censoring is informative only if it is unrelated to prognosis: loss to follow-up concentrated among the patients who were doing worse biases the curve upwards, and the manuscript should say why follow-up was lost."
    "cruce.si": "The curves cross within the common follow-up. When that happens the log-rank test loses power, because differences in one stretch cancel those in the other, and a single hazard ratio stops summarising what happens. Compare survival at specific times and describe the crossing instead of reducing it to one number."
    "cruce.no": "The curves do not cross within the common follow-up, which is the situation in which the log-rank test and a single hazard ratio can be read without reservations."
    "escala.log-log": "log-log of Kalbfleisch and Prentice [{ref:kalbfleisch2002}]"
    "escala.log": "logarithmic"
    metodos_logrank: " and the curves were compared with the log-rank test [{ref:mantel1966},{ref:peto1972}]"
  avisos:
    "pocos_eventos.uno": "The curve has fewer than {minimo} events ({eventos} in total): the curve, its confidence band and the median are very unstable. Interpret with caution and report the number of events alongside the estimate."
    "pocos_eventos.dos": "Some curve has fewer than {minimo} events (the sparsest has {eventos}): the curves, their bands and the medians are very unstable, and the log-rank test has little power. Interpret with caution and report the number of events, not just the p value."
    logrank_indefinido: "The log-rank test is not defined for these data: the variance of its statistic is 0. R either stops with a singular system or reports zero degrees of freedom, so χ², the degrees of freedom and the p value are reported as undefined."
    curvas_cruzan: "The curves cross: the log-rank test loses power and the hazard ratio does not summarise the difference well. Compare survival at specific times."
    mediana_no_alcanzada: "In some group the curve never drops below 0.5 during follow-up: the median was not reached and is reported as undefined. Do not replace it with the last observed time."
    t_fuera: "These times of interest lie beyond the follow-up of at least one curve: {tiempos}. Last observed time by group code: {detalle}. Where there is no follow-up, survival is undefined, because extending the curve past the last data point adds no information."
    un_grupo: "A single curve is being estimated: without a group column (or with a single code) there is no log-rank test and no second curve to compare."
    censura_alta: "More than half of the follow-up is censored ({censuras} of {n} patients): the tail of the curve rests on very few cases and the median may not be reached. Check the numbers-at-risk table before interpreting the final stretch."
  metodos: "Survival functions were estimated with the Kaplan-Meier method [{ref:kaplan1958}] with {nivel} CIs based on Greenwood's formula [{ref:greenwood1926}] on the {escala_frase} scale; the median and its CI follow Brookmeyer and Crowley [{ref:brookmeyer1982}]{frase_logrank}. Calculations used the \"{titulo_corto}\" calculator of Bioestadística abierta (Research Group UDG-CA-1190, {url}), verified against R's survival package [{ref:therneau2024}] (survfit, quantile.survfit and survdiff)."
  ejemplo_descripcion: "Illustrative example: 30 patients with dengue followed to defervescence (the event), 15 with a negative NS1 antigen (group 0) and 15 with a positive one (group 1), with six censored losses to follow-up; times are in days (fictitious data, not real). Careful when reading the curve: here the event is a good outcome, so S(t) is the proportion of patients still febrile and a fast drop is good news."
  grafica_titulo: "Kaplan-Meier curves by group with their confidence band, censoring marks and the numbers-at-risk table"
