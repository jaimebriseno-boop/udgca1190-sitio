  ayudas:
    diseno: "In a cohort or a trial all five measures are interpretable. In a cross-sectional study the RR is a prevalence ratio. In a case-control study only the odds ratio is valid."
    metodo_rra: "Newcombe (method 10) combines the Wilson intervals of both risks and behaves better with small samples or extreme risks; Wald is the classical approximation."
    corr: "Use it when a cell is 0: it adds 0.5 to the four cells before computing the RR and the OR (it does not affect the risks, the ARR or the NNT)."
  interpretacion:
    "resumen.cohorte": "Of {n1} exposed or treated people, {a} had the outcome ({p1}; {nivel} CI: {p1_ic}); of {n0} unexposed or controls, {c} had it ({p0}; {nivel} CI: {p0_ic}). The absolute risk difference is {rra} percentage points ({nivel} CI: {rra_ic}) and the relative change in risk (RRR = 1 − RR) is {rrr} ({rrr_ic})."
    "resumen.transversal": "A cross-sectional design estimates prevalences, not incidences: {a} of {n1} exposed had the outcome ({p1}; {nivel} CI: {p1_ic}) versus {c} of {n0} unexposed ({p0}; {nivel} CI: {p0_ic}). The ratio {rr} reads as a prevalence ratio and the absolute difference in prevalence is {rra} percentage points ({nivel} CI: {rra_ic}); because exposure and outcome were measured at the same time, the association does not tell which came first."
    "resumen.casos_controles": "In a case-control design the sampling fixes how many cases and how many controls are studied, so {p1} and {p0} are not population risks: the relative risk, the absolute reduction, the relative reduction and the NNT are not interpretable and only the odds ratio is. {n1} exposed and {n0} unexposed participants were analysed ({n} in total)."
    "rr.excluye": "RR = {rr} ({rr_ic}): the risk in the exposed or treated group is {rr} times that of the reference group and the interval excludes 1, so the data are hardly compatible with no association."
    "rr.cruza": "RR = {rr} ({rr_ic}): the relative risk interval does not exclude 1 (or is undefined), so the data rule out neither a reduction nor an increase in risk."
    "rr.transversal.excluye": "PR = {rr} ({rr_ic}): the prevalence of the outcome in the exposed group is {rr} times that of the reference group and the interval excludes 1, so the data are hardly compatible with no association."
    "rr.transversal.cruza": "PR = {rr} ({rr_ic}): the prevalence ratio interval does not exclude 1 (or is undefined), so the data rule out neither a lower nor a higher prevalence in the exposed group."
    or: "OR = {or} ({or_ic}). The odds ratio compares the odds of the outcome between the exposed or treated group and the reference group: it approximates the relative risk only when the outcome is rare and, with common outcomes, it moves further from 1 and exaggerates the effect. With a cell at 0 it becomes 0 or infinite and has no interval, unless the Haldane-Anscombe correction is applied."
    "nnt.beneficio.excluye": "{nnt} people have to be treated or exposed to avoid one additional event (NNTB; exact value {nnt_exacto}; {nivel} CI: {nnt_ic})."
    "nnt.dano.excluye": "Exposing {nnt} people is enough to cause one additional event (NNTH; exact value {nnt_exacto}; {nivel} CI: {nnt_ic})."
    "nnt.cruza": "The point estimate is {nnt} people ({nnt_exacto}), but the interval of the absolute risk difference includes 0 and the NNT has no two finite limits of the same sign: it is reported with Altman's notation, {nnt_ic}, where NNTB is the number needed to avoid one event and NNTH the number needed to cause one."
    "nnt.nulo": "Both groups had the same risk ({p1} versus {p0}): the absolute difference is 0 and the number needed to treat is undefined ({nnt}); the interval, {nnt_ic}, spans from benefit to harm."
    "nnt.transversal": "The reciprocal of the prevalence difference is {nnt_exacto} ({nnt_ic}). In a cross-sectional design that figure describes the observed association, not the effect of intervening: exposure and outcome were measured at the same time, so it cannot be read as \"people who need to be treated\"."
    "metodos_rra.newcombe": "Newcombe's hybrid score interval, method 10 [{ref:newcombe1998diff}]"
    "metodos_rra.wald": "Wald interval"
    "metodos_diseno.cohorte": "The relative risk ({nivel} CI by Katz's method) [{ref:katz1978}], the odds ratio (Woolf's method) [{ref:woolf1955}], the absolute risk reduction ({metodo_rra_frase}) and the number needed to treat (reciprocal of the ARR and of its limits [{ref:laupacis1988},{ref:altman1998}]) were estimated."
    "metodos_diseno.transversal": "The prevalence ratio ({nivel} CI by Katz's method) [{ref:katz1978}], the odds ratio (Woolf's method) [{ref:woolf1955}], the absolute difference in prevalence ({metodo_rra_frase}) and its reciprocal [{ref:laupacis1988},{ref:altman1998}] were estimated."
    "metodos_diseno.casos_controles": "The odds ratio ({nivel} CI by Woolf's method) [{ref:woolf1955}] was estimated; because of the case-control design, risks, relative risk, absolute reduction and number needed to treat were not estimated."
    metodos_haldane: "The relative risk and the odds ratio were computed after adding 0.5 to each cell of the table (Haldane-Anscombe correction) [{ref:haldane1956},{ref:anscombe1956}]."
  avisos:
    celda_cero: "One cell is 0: the relative risk or the odds ratio become 0 or infinite and have no interval. You can apply the Haldane-Anscombe correction (add 0.5 to each cell) in the selector; report it if you use it. The risks, the absolute reduction and the NNT do not change."
    haldane_aplicado: "Haldane-Anscombe correction applied: the relative risk, the odds ratio and the relative risk reduction were computed with 0.5 added to each cell. The risks, the absolute reduction and the NNT do not change. Report it in Methods."
    p0_cero: "Nobody had the outcome in the reference group (p₀ = 0): the relative risk goes to infinity and has no interval; if there were no events among the exposed either, it is 0/0 and undefined. The absolute risk difference and its interval remain valid."
    or_no_aproxima_rr: "The risk in the reference group is above 10%: the odds ratio moves away from the relative risk and exaggerates the effect. The OR approximates the RR only when the outcome is rare; report the relative risk as the main measure."
    n_pequeno: "Small groups ({expuestos} exposed or treated, {no_expuestos} unexposed or controls): with fewer than 10 per group the intervals are very wide and the estimates unstable."
    casos_controles: "Case-control design: only the odds ratio is interpretable. The relative risk, the absolute reduction, the relative reduction and the number needed to treat are not shown because the sampling fixes the proportion of cases."
    rra_cruza_cero: "The interval of the absolute risk difference includes 0: the number needed to treat is reported with Altman's notation (NNTB to ∞ to NNTH), because the interval spans from benefit to harm."
  metodos: "{frase_medidas}{nota_corr} Calculations used the \"{titulo_corto}\" calculator of Bioestadística abierta (Research Group UDG-CA-1190, {url}), verified against R."
  ejemplo_descripcion: "Illustrative example: early versus late intravenous hydration in 200 patients with dengue with warning signs; outcome, severe dengue. Of 100 with early hydration, 12 progressed to severe dengue; of 100 with late hydration, 30 (fictitious data)."
  grafica_titulo: "Estimates with their confidence interval: risk in each group (top), ratios on a log scale and risk difference (bottom)"
